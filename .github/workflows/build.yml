name: Build Tweak
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build Dylib
        run: make

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: FCMMenu-Dylib
          path: .theos/obj/**/*.dylib