name: Build Tweak
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v2
    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
    - name: Build Package
      run: |
        make package
    - name: Upload Deb
      uses: actions/upload-artifact@v2
      with:
        name: FCMMenu-Deb
        path: packages/*.deb

